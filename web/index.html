<!DOCTYPE html>
<html>

<head>
  <!-- ตั้งค่า Base URL สำหรับ URL ที่สัมพันธ์กันทั้งหมด -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- การตั้งค่าการเข้ารหัสตัวอักษรเป็น UTF-8 -->
  <meta charset="UTF-8">

  <!-- การตั้งค่าความเข้ากันได้กับ Internet Explorer -->
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- คำอธิบายเกี่ยวกับเว็บไซต์ -->
  <meta name="description" content="A new Flutter project.">

  <!-- ตั้งค่าสีธีมสำหรับโหมดสว่างและโหมดมืด -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="white" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="black" />

  <!-- ระบุสีสันที่รองรับ -->
  <meta name="color-scheme" content="light dark">

  <script src="loader.js"></script>

  <!-- การเชื่อมต่อกับ Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fonts.css">

  <!-- เมต้าแท็กและไอคอนสำหรับ iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="melonkemo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- ไอคอนฟาเวอิคอนของเว็บไซต์ -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- ชื่อของหน้าเว็บ -->
  <title>melonkemo</title>

  <!-- ลิงก์ไปยังไฟล์ Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- JavaScript สำหรับโหลดเวอร์ชันของ Service Worker -->
  <script>
    // ค่าด้านล่างนี้ถูกแทรกโดยการสร้าง Flutter, อย่าปรับเปลี่ยน
    var serviceWorkerVersion = {{ flutter_service_worker_version }};
  </script>

  <!-- JavaScript สำหรับการเริ่มต้นแอป Flutter -->
  <script src="flutter.js" defer></script>
</head>

<body>
  <!-- JavaScript สำหรับโหลดและรันแอป Flutter -->
  <script src="main.dart.js" type="application/javascript" onendload="document.getElementById('loader').remove();"></script>
  
  <!-- สคริปต์สำหรับการเริ่มต้น Flutter, โหลดแบบอะซิงโครนัส -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- สคริปต์ที่ใช้ในการเริ่มต้นเอนจินของ Flutter และรันแอป -->
  <script>
    window.addEventListener('load', function () {
      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine(currentPathModel.rendererConfig).then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>

</html>
