name: melonkemo
description: A new Flutter project.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: 3.24.0

dependencies:
  flutter:
    sdk: flutter

  win32: ^5.5.4
  dartx: ^1.2.0
  uuid: ^4.4.2
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  collection: ^1.18.0
  rive: ^0.13.4
  auto_size_text: ^3.0.0
  provider: ^6.1.2
  go_router: ^14.2.3
  shared_preferences: ^2.3.1
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.2.2
  bot_toast: ^4.1.3
  flutter_spinkit: ^5.2.1
  layout: ^1.0.5
  fluid_dialog: ^2.0.0
  pull_down_button: ^0.10.1
  adaptive_action_sheet: ^2.0.3
  modal_bottom_sheet: ^3.0.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.7
  demoji: ^2.0.0
  simple_icons: ^10.1.3
  scrollable_positioned_list: ^0.3.8
  wolt_modal_sheet: ^0.9.2
  shimmer: ^3.0.0
  promptpay_qrcode_generate: ^1.0.2
  intl: ^0.19.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
  - assets/rive/
  - assets/images/
  - assets/icons/

  fonts:
    - family: KosugiMaru
      fonts:
        - asset: fonts/kosugi_maru_regular.ttf
    - family: VarelaRound
      fonts:
        - asset: fonts/VarelaRound-Regular.ttf
    - family: Itim
      fonts:
        - asset: fonts/itim_regular.ttf
    - family: MochiyPopOne
      fonts:
        - asset: fonts/mochiy_pop_one_regular.ttf
    - family: Sarabun
      fonts:
        - asset: fonts/sarabun/Sarabun-Thin.ttf
          weight: 200
        - asset: fonts/sarabun/Sarabun-ExtraLight.ttf
          weight: 300
        - asset: fonts/sarabun/Sarabun-Light.ttf
          weight: 400
        - asset: fonts/sarabun/Sarabun-Regular.ttf
          weight: 500
        - asset: fonts/sarabun/Sarabun-Medium.ttf
          weight: 600
        - asset: fonts/sarabun/Sarabun-Bold.ttf
          weight: 700
        - asset: fonts/sarabun/Sarabun-ExtraBold.ttf
          weight: 800
    - family: Mali
      fonts:
        - asset: fonts/mali/Mali-ExtraLight.ttf
          weight: 300
        - asset: fonts/mali/Mali-Light.ttf
          weight: 400
        - asset: fonts/mali/Mali-Regular.ttf
          weight: 500
        - asset: fonts/mali/Mali-Medium.ttf
          weight: 600
        - asset: fonts/mali/Mali-Bold.ttf
          weight: 700
    - family: MPlus
      fonts:
        - asset: fonts/m_plus_rounded/MPLUSRounded1c-Thin.ttf
          weight: 300
        - asset: fonts/m_plus_rounded/MPLUSRounded1c-Light.ttf
          weight: 400
        - asset: fonts/m_plus_rounded/MPLUSRounded1c-Regular.ttf
          weight: 500
        - asset: fonts/m_plus_rounded/MPLUSRounded1c-Medium.ttf
          weight: 600
        - asset: fonts/m_plus_rounded/MPLUSRounded1c-Bold.ttf
          weight: 700
    - family: Bai
      fonts:
        - asset: fonts/Bai_Jamjuree/BaiJamjuree-ExtraLight.ttf
          weight: 300
        - asset: fonts/Bai_Jamjuree/BaiJamjuree-Light.ttf
          weight: 400
        - asset: fonts/Bai_Jamjuree/BaiJamjuree-Regular.ttf
          weight: 500
        - asset: fonts/Bai_Jamjuree/BaiJamjuree-Medium.ttf
          weight: 600
        - asset: fonts/Bai_Jamjuree/BaiJamjuree-SemiBold.ttf
          weight: 700
        - asset: fonts/Bai_Jamjuree/BaiJamjuree-Bold.ttf
          weight: 800

flutter_launcher_icons:
  web:
    generate: true
    image_path: "assets/icons/web_icon.png"